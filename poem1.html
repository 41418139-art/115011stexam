<head>

    <title>詩的賞析1 - 將進酒</title>
    <!-- 網頁內嵌式樣式設定 -->
    <style>
        body {
            background-color: pink; /* 整頁背景設為粉紅色 */
            font-family: "Microsoft JhengHei", "標楷體", serif;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: blue;      /* 詩的標題設為藍色 */
            font-size: 40pt;  /* 40點字 */
            margin-bottom: 20px;
        }
        .poem-content {
            color: green;     /* 詩的內容設為綠色 */
            font-size: 30pt;  /* 30點字 */
            line-height: 1.6;
        }
        .poet-img {
            width: 300px;               /* 寬為300px */
            border: 5px solid #4B0082;  /* 深紫色圖框線(5px) */
            border-radius: 50px;        /* 四周做成圓角(半徑50px) */
            margin: 30px auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>將進酒 — 李白</h1>

    <img src="libai.jpg" alt="李白畫像" class="poet-img">

    <div class="poem-content">
        <p>
            君不見黃河之水天上來，奔流到海不復回。<br>
            君不見高堂明鏡悲白髮，朝如青絲暮成雪。<br>
            人生得意須盡歡，莫使金樽空對月。<br>
            天生我材必有用，千金散盡還復來。<br>
            烹羊宰牛且為樂，會須一飲三百杯。<br>
            岑夫子，丹丘生，將進酒，杯莫停。<br>
            與君歌一曲，請君為我傾耳聽。<br>
            鐘鼓饌玉不足貴，但願長醉不願醒。<br>
            古來聖賢皆寂寞，惟有飲者留其名。<br>
            陳王昔時宴平樂，斗酒十千恣歡謔。<br>
            主人何為言少錢，徑須沽取對君酌。<br>
            五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。
        </p>
    </div>
